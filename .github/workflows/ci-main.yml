name: Deploy Production (Main -> OCI/Cloudflare)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
  AWS_DEFAULT_REGION: sa-saopaulo-1
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
  S3_ENDPOINT: https://grmykw8bmw9d.compat.objectstorage.sa-saopaulo-1.oraclecloud.com
  DEPLOY_BUCKET: ecolchain-web-mgmt-prod

jobs:
  deploy-production:
    name: Deploy to Production (manage.ecolchain.com)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Run Build (static export -> app/out)
        env:
          NEXT_PUBLIC_API_URL: https://api.ecolchain.com
        run: npm run build

      - name: Deploy to OCI Bucket (prod)
        run: |
          aws s3 sync out/ "s3://$DEPLOY_BUCKET" --delete \
            --endpoint-url "$S3_ENDPOINT" --region "$AWS_DEFAULT_REGION"
          echo "Deploy prod concluido -> https://manage.ecolchain.com"

      - name: Purge Cloudflare Cache
        env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "X-Auth-Email: $CF_EMAIL" \
            -H "X-Auth-Key: $CF_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | head -c 300
          echo ""
          echo "Cache Cloudflare purgado."
